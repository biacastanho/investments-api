name: CD

# Roda sempre que o CI termina; o deploy só acontece se o CI passou em um push na main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy em produção (Azure App Service)
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request' &&
      vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}/swagger

    steps:
      - name: Baixa o artefato gerado pelo CI
        uses: actions/download-artifact@v8
        with:
          name: investments-api
          path: ./app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publica no Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./app

      - name: Verifica se a API está no ar
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          echo "Consultando $APP_URL/health"
          curl --silent --show-error --fail \
               --retry 12 --retry-delay 10 --retry-all-errors --max-time 60 \
               "$APP_URL/health" | tee health.json
          echo
          grep -q '"status":"Healthy"' health.json

      - name: Resumo
        env:
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          echo "### Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Swagger: $APP_URL/swagger" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health: \`$(cat health.json)\`" >> "$GITHUB_STEP_SUMMARY"

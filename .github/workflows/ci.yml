name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 8.0.x
  SOLUTION: InvestmentsApi.sln
  API_PROJECT: src/Investments.Api/Investments.Api.csproj
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build-test-publish:
    name: Build, testes e artefato
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Instala o .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaura as dependências
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Compila a solução
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore -p:Version=${{ env.APP_VERSION }}

      - name: Executa os testes automatizados
        run: >
          dotnet test ${{ env.SOLUTION }}
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./test-results

      - name: Publica o resultado dos testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./test-results
          retention-days: 14

      - name: Gera o pacote de publicação
        run: >
          dotnet publish ${{ env.API_PROJECT }}
          --configuration Release
          --no-build
          --output ./publish
          -p:Version=${{ env.APP_VERSION }}

      - name: Publica o artefato de deploy
        uses: actions/upload-artifact@v7
        with:
          name: investments-api
          path: ./publish
          if-no-files-found: error
          retention-days: 14

      - name: Resumo
        run: |
          echo "### Build ${{ env.APP_VERSION }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Testes: aprovados" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artefato: \`investments-api\` ($(du -sh ./publish | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
